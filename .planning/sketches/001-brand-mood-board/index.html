<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketch 001 — Brand Mood Board (v2 restrained)</title>
  <link rel="stylesheet" href="../themes/default.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      color: var(--color-text);
      background: var(--color-bg);
      min-height: 100vh;
      padding-top: 56px;
      transition: background 0.2s ease, color 0.15s ease;
    }
    button, .card, .chip { transition: all 0.15s ease; }

    #variant-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--color-border);
      padding: 8px 16px;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .variant-tab {
      font-family: var(--font-sans);
      font-size: 13px; font-weight: 600;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      cursor: pointer;
    }
    .variant-tab:hover { border-color: var(--color-text-muted); }
    .variant-tab.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .nav-label { font-size: 12px; color: var(--color-text-muted); margin-right: 8px; }
    .badge-v2 {
      font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
      background: #e7e5e4; color: #44403c;
      padding: 3px 7px; border-radius: 4px;
    }

    .shell { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .shell.viewport-phone { max-width: 375px; }
    .shell.viewport-tablet { max-width: 768px; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 36px; height: 36px; border-radius: 9px;
      background: var(--color-primary);
      display: grid; place-items: center;
      color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 16px;
      position: relative;
    }
    .mark::after {
      content: "";
      position: absolute; right: 5px; bottom: 5px;
      width: 6px; height: 6px; border-radius: 1.5px;
      background: rgba(255,255,255,0.75);
    }
    .brand h1 {
      margin: 0; font-family: var(--font-display); font-size: 1.2rem; letter-spacing: -0.02em;
    }
    .brand p { margin: 2px 0 0; font-size: 12px; color: var(--color-text-muted); }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: none; border-radius: var(--radius-md);
      padding: 9px 13px; font-weight: 600; font-size: 13px; cursor: pointer;
      font-family: var(--font-sans);
    }
    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-ghost {
      background: var(--color-surface); color: var(--color-text);
      border: 1px solid var(--color-border);
    }
    .btn-ghost:hover { border-color: var(--color-text-muted); }

    .note {
      font-size: 13px; color: var(--color-text-muted);
      border-left: 2px solid var(--color-border);
      padding: 8px 12px; margin-bottom: 18px;
      background: var(--color-surface);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .note strong { color: var(--color-text); font-weight: 600; }

    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(180px, 1fr));
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
    }
    @media (max-width: 900px) {
      .board { grid-template-columns: repeat(5, 220px); }
    }

    .col {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 10px;
      min-height: 400px;
    }
    .col-h {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; padding: 0 2px;
    }
    .col-h h2 {
      margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--color-text-muted); font-weight: 650;
    }
    .count {
      background: var(--color-surface-soft);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      font-size: 11px; padding: 2px 7px; color: var(--color-text-muted);
    }

    .card {
      background: var(--color-surface-soft);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 11px;
      margin-bottom: 8px;
      cursor: grab;
    }
    .card:hover {
      border-color: color-mix(in srgb, var(--color-text) 18%, var(--color-border));
      box-shadow: var(--shadow-sm);
    }
    .card.dragging { opacity: 0.45; }
    .card h3 {
      margin: 0 0 5px; font-size: 13.5px; font-weight: 600; line-height: 1.35;
    }
    .card p { margin: 0; font-size: 12px; color: var(--color-text-muted); line-height: 1.4; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
    .chip {
      font-size: 10.5px; font-weight: 600;
      padding: 2px 7px; border-radius: var(--radius-full);
      background: var(--color-surface); color: var(--color-text-muted);
      border: 1px solid var(--color-border);
    }
    .chip.accent {
      background: var(--color-accent-soft); color: var(--color-accent);
      border-color: transparent;
    }
    .chip.ok { color: var(--color-success); }
    .chip.warn { color: var(--color-primary); }

    .toast {
      position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%) translateY(20px);
      background: var(--color-text); color: #fff;
      padding: 10px 16px; border-radius: var(--radius-md);
      font-size: 13px; opacity: 0; pointer-events: none;
      transition: all 0.2s ease; z-index: 10000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #sketch-tools {
      position: fixed; bottom: 12px; right: 12px; z-index: 9999;
      font-family: system-ui; font-size: 12px;
      background: rgba(0,0,0,0.72); color: white;
      padding: 8px 12px; border-radius: 8px;
      opacity: 0.4; transition: opacity 0.2s;
      display: flex; gap: 8px; align-items: center;
    }
    #sketch-tools:hover { opacity: 1; }
    #sketch-tools select, #sketch-tools button {
      font-size: 11px; border-radius: 4px; border: none; padding: 4px 6px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="variant-nav">
    <span class="nav-label">Sketch 001 · Mood</span>
    <span class="badge-v2">v2 RESTRAINED</span>
    <button class="variant-tab active" data-v="a" onclick="showVariant('a')">A: Quiet Stone</button>
    <button class="variant-tab" data-v="b" onclick="showVariant('b')">B: Cool Mist</button>
    <button class="variant-tab" data-v="c" onclick="showVariant('c')">C: Soft Ember</button>
  </div>

  <div class="shell" id="viewport">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">P</div>
        <div>
          <h1>Puzzlessbox</h1>
          <p id="mood-line">Restrained · adult · one quiet accent</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="btn-empty" type="button">Empty</button>
        <button class="btn btn-ghost" id="btn-populate" type="button">Populate</button>
        <button class="btn btn-primary" id="btn-capture" type="button">+ Capture</button>
      </div>
    </header>

    <div class="note">
      <strong id="mood-title">Quiet Stone</strong> —
      <span id="mood-desc">Neutrale Steingrau-Fläche. Primary = Charcoal. Teal nur auf Status-Chips. Keine bunten Spalten, kein Blob.</span>
    </div>

    <div class="board" id="board">
      <section class="col" data-col="inbox">
        <div class="col-h"><h2>Inbox</h2><span class="count" data-count>0</span></div>
        <div class="cards"></div>
      </section>
      <section class="col" data-col="notes">
        <div class="col-h"><h2>Notizen</h2><span class="count" data-count>0</span></div>
        <div class="cards"></div>
      </section>
      <section class="col" data-col="links">
        <div class="col-h"><h2>Links</h2><span class="count" data-count>0</span></div>
        <div class="cards"></div>
      </section>
      <section class="col" data-col="tasks">
        <div class="col-h"><h2>Tasks</h2><span class="count" data-count>0</span></div>
        <div class="cards"></div>
      </section>
      <section class="col" data-col="events">
        <div class="col-h"><h2>Termine</h2><span class="count" data-count>0</span></div>
        <div class="cards"></div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="sketch-tools">
    <select id="theme-switcher">
      <option value="">Quiet Stone</option>
      <option value="cool">Cool Mist</option>
      <option value="ember">Soft Ember</option>
    </select>
    <button type="button" onclick="setViewport('phone')">375</button>
    <button type="button" onclick="setViewport('tablet')">768</button>
    <button type="button" onclick="setViewport('desktop')">Full</button>
  </div>

  <script>
    const SEED = [
      { col: 'inbox', title: 'Idee: Voice-Capture nach dem Meeting', summary: 'Kurz festhalten, später sortieren.', type: 'Notiz', status: 'pending' },
      { col: 'notes', title: 'Hermes Timeout = API State Machine', summary: 'Cron tickt nur 60s — Draft braucht auto_saved.', type: 'Notiz', status: 'ok' },
      { col: 'links', title: 'FastMCP Bearer Auth Docs', summary: 'https://gofastmcp.com — Token rotierbar.', type: 'Link', status: 'ok' },
      { col: 'tasks', title: 'BRAND-01 Asset-Export SVG/PNG', summary: 'Wortmarke · Symbol · Kombi vor Phase 4.', type: 'Task', status: 'warn' },
      { col: 'events', title: 'Discuss Phase 0 abschließen', summary: 'Morgen 10:00 — Logo + Tokens locken.', type: 'Termin', status: 'ok' },
      { col: 'tasks', title: 'Coolify Health Checks', summary: 'OPS später — jetzt nur Branding.', type: 'Task', status: 'pending' },
    ];

    const MOOD = {
      a: {
        theme: '',
        title: 'Quiet Stone',
        desc: 'Neutrale Steingrau-Fläche. Primary = Charcoal. Teal nur auf Status-Chips. Keine bunten Spalten, kein Blob.',
        line: 'Restrained · stone · charcoal CTA',
      },
      b: {
        theme: 'cool',
        title: 'Cool Mist',
        desc: 'Kühles Slate. Primary dunkelgrau. Ein Cyan-Teal als stiller Akzent. Toolig, nicht kalt-enterprise.',
        line: 'Restrained · cool mist · teal whisper',
      },
      c: {
        theme: 'ember',
        title: 'Soft Ember',
        desc: 'Fast monochrom. Einzige Wärme: Orange nur auf Primary-Button. Rest neutral.',
        line: 'Restrained · mono · warm CTA only',
      },
    };

    let items = [];
    let dragId = null;
    let nextId = 100;

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1500);
    }

    function applyTheme(name) {
      if (!name) document.body.removeAttribute('data-theme');
      else document.body.setAttribute('data-theme', name);
    }

    function showVariant(id) {
      document.querySelectorAll('.variant-tab').forEach(t => t.classList.toggle('active', t.dataset.v === id));
      const m = MOOD[id];
      applyTheme(m.theme);
      document.getElementById('mood-title').textContent = m.title;
      document.getElementById('mood-desc').textContent = m.desc;
      document.getElementById('mood-line').textContent = m.line;
      document.getElementById('theme-switcher').value = m.theme;
      toast('v2 · ' + m.title);
    }

    function statusChip(s) {
      if (s === 'ok') return '<span class="chip accent ok">auto_saved</span>';
      if (s === 'warn') return '<span class="chip warn">pending</span>';
      return '<span class="chip">draft</span>';
    }

    function render() {
      document.querySelectorAll('.col').forEach(col => {
        const key = col.dataset.col;
        const list = items.filter(i => i.col === key);
        col.querySelector('[data-count]').textContent = list.length;
        const wrap = col.querySelector('.cards');
        if (!list.length) {
          wrap.innerHTML = '<p style="font-size:12px;color:var(--color-text-muted);padding:8px 4px;">Keine Einträge</p>';
          return;
        }
        wrap.innerHTML = list.map(i => `
          <article class="card" draggable="true" data-id="${i.id}">
            <h3>${i.title}</h3>
            <p>${i.summary}</p>
            <div class="meta">
              <span class="chip">${i.type}</span>
              ${statusChip(i.status)}
            </div>
          </article>
        `).join('');
      });
      bindDrag();
    }

    function bindDrag() {
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('dragstart', e => {
          dragId = card.dataset.id;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
      });
      document.querySelectorAll('.col').forEach(col => {
        col.addEventListener('dragover', e => {
          e.preventDefault();
          col.style.outline = '1px solid var(--color-text-muted)';
        });
        col.addEventListener('dragleave', () => { col.style.outline = ''; });
        col.addEventListener('drop', e => {
          e.preventDefault();
          col.style.outline = '';
          const item = items.find(i => String(i.id) === String(dragId));
          if (!item) return;
          item.col = col.dataset.col;
          render();
          toast('→ ' + col.dataset.col);
        });
      });
    }

    function populate() {
      items = SEED.map((s, i) => ({ ...s, id: i + 1 }));
      render();
    }

    function emptyBoard() {
      items = [];
      render();
      toast('Empty');
    }

    function capture() {
      const btn = document.getElementById('btn-capture');
      btn.textContent = '…';
      btn.disabled = true;
      setTimeout(() => {
        items.unshift({
          id: nextId++,
          col: 'inbox',
          title: 'Frisch captured: „Milch & Filter“',
          summary: 'auto_saved nach 30s.',
          type: 'Notiz',
          status: 'ok',
        });
        render();
        btn.textContent = '+ Capture';
        btn.disabled = false;
        toast('Capture → Inbox');
      }, 400);
    }

    function setViewport(mode) {
      const v = document.getElementById('viewport');
      v.classList.remove('viewport-phone', 'viewport-tablet');
      if (mode === 'phone') v.classList.add('viewport-phone');
      if (mode === 'tablet') v.classList.add('viewport-tablet');
    }

    document.getElementById('btn-populate').onclick = populate;
    document.getElementById('btn-empty').onclick = emptyBoard;
    document.getElementById('btn-capture').onclick = capture;
    document.getElementById('theme-switcher').onchange = (e) => {
      const entry = Object.entries(MOOD).find(([, m]) => m.theme === e.target.value);
      if (entry) showVariant(entry[0]);
      else applyTheme(e.target.value);
    };

    populate();
    showVariant('a');
  </script>
</body>
</html>
