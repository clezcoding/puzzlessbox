# Coolify-internal scraper stack (D-14, D-15). No published ports — attach to internal network only.
services:
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    restart: unless-stopped
    environment:
      PORT: "3002"
      FIRECRAWL_API_KEY: ${FIRECRAWL_BEARER:-change-me}
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - scraper_internal

  camoufox:
    image: daijro/camoufox:latest
    restart: unless-stopped
    environment:
      PORT: "8080"
      CAMOUFOX_BEARER: ${CAMOUFOX_BEARER:-change-me}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - scraper_internal

networks:
  scraper_internal:
    internal: true
