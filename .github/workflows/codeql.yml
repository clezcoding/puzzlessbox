name: CodeQL

on:
  push:
    paths:
      - "brand/**"
      - "api/**"
      - "mcp-server/**"
      - "webapp/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "brand/**"
      - "api/**"
      - "mcp-server/**"
      - "webapp/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  # Pin bundle tag; bump when upgrading CodeQL CLI (see github/codeql-action releases).
  CODEQL_BUNDLE_TAG: codeql-bundle-v2.26.2

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install CodeQL CLI
        run: |
          curl -fsSL -o /tmp/codeql-bundle.tar.zst \
            "https://github.com/github/codeql-action/releases/download/${CODEQL_BUNDLE_TAG}/codeql-bundle-linux64.tar.zst"
          mkdir -p "$RUNNER_TOOL_CACHE/codeql"
          tar --use-compress-program=unzstd -xf /tmp/codeql-bundle.tar.zst -C "$RUNNER_TOOL_CACHE/codeql"
          CODEQL_DIR="$RUNNER_TOOL_CACHE/codeql/codeql"
          echo "$CODEQL_DIR" >> "$GITHUB_PATH"
          "$CODEQL_DIR/codeql" version

      - name: Create database
        run: codeql database create codeql-db --language=javascript --source-root=.

      - name: Analyze
        run: |
          mkdir -p sarif-results
          codeql database analyze codeql-db \
            --format=sarif-latest \
            --output=sarif-results/javascript.sarif \
            javascript-security-and-quality.qls

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 30
          if-no-files-found: ignore
