name: CodeQL

on:
  push:
    paths:
      - "brand/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "brand/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          # Code Scanning (SARIF upload) requires GitHub Pro on private repos.
          # Analysis still runs locally and fails the job on real findings.
          upload: false
