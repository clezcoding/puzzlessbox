name: CodeQL

on:
  push:
    paths:
      - "brand/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "brand/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          # Code Scanning (SARIF upload) requires GitHub Pro on private repos.
          # Analysis still runs locally and fails the job on real findings.
          upload: false
